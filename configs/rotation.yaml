# Rotation: random rotation within a fixed angle range
condition: rotation
seed: 42

data_root: data
batch_size: 32
learning_rate: 0.001
epochs: 20
dropout: 0.3
use_class_weights: false

aug_params:
  rotation_degrees: 20 

checkpoint_dir: results/checkpoints
use_wandb: true
wandb_project: tomato-leaf-augmentation
